<!doctype html>
<!--
  ГЛАВНАЯ HTML-СТРАНИЦА МИНИ-АППА

  Это "скелет" дома: почти пустая страница с одним пустым <div id="root">.
  Всё остальное (экраны, кнопки, пары) рисует React через JavaScript.
  Аналогия: index.html — пустая сцена в театре, React — актёры, которые
  на неё выходят и показывают спектакль.

  lang="ru" — говорим браузеру, что текст русский (правильные переносы слов,
  правильное чтение для экранных дикторов у незрячих пользователей).
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport — "как масштабировать страницу на телефоне".
      width=device-width — ширина страницы = ширина экрана телефона.
      viewport-fit=cover — занять весь экран, включая "чёлку" iPhone.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Не превращать номера групп и аудиторий в ссылки "позвонить" на iPhone -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Неофициальное расписание пар БГУФК для Telegram" />
    <meta name="theme-color" content="#00703C" />
    <title>Расписание пар БГУФК</title>

    <!--
      ОФИЦИАЛЬНЫЙ СКРИПТ TELEGRAM для мини-аппов.
      Он создаёт объект window.Telegram.WebApp — это "пульт управления"
      Telegram: узнать тему (светлая/тёмная), показать кнопку "Назад",
      сделать лёгкую вибрацию и т.д.

      Почему скрипт с сайта Telegram, а не библиотека из npm:
      Telegram сам рекомендует подключать именно так, этот файл всегда
      совпадает с версией Telegram у пользователя, и нам не нужна лишняя
      библиотека-прослойка для MVP. Позже можно перейти на @telegram-apps/sdk.

      Подключаем ДО нашего кода, чтобы к моменту запуска React объект уже был.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- type="module" — современный формат JS с import/export. Vite сам
         подменит этот путь на собранный файл при сборке. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
